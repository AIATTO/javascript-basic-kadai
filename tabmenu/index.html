<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>タブメニュー</title>
    <!-- スタイルシートを読み込む -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="tabMenu">
        <h2 class="tab active">メニュー1</h2>
        <h2 class="tab">メニュー2</h2>
        <h2 class="tab">メニュー3</h2>
      </div>

      <div class="tabContent">
        <div class="content active">
          <p>1枚目メニュー内容です。</p>
        </div>
        <div class="content">
          <p>2枚目メニュー内容です。</p>
        </div>
        <div class="content">
          <p>3枚目メニュー内容です。</p>
        </div>
      </div>
    </div>

    <!-- スクリプトを読み込む -->
    <script src="scripts.js"></script>
  </body>
</html>
