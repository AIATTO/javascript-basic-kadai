<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Swiperの使い方</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="swiper swiper-top">
      <div class="swiper-wrapper swiper-top-wrapper">
        <div class="swiper-slide swiper-top-slide">
          <img
            src="../swiper/images/0NeVo_tdRnaQNac3m1_sHA.jpg"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="../swiper/images/aiIai4mvSM22eLmEbtzSKA.jpg"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="../swiper/images/aTjcRzg8R3mkU1V2eD5zpQ.jpg"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="../swiper/images/IMG_0491.jpeg"
            alt=""
          />
        </div>
        <div class="swiper-slide">
          <img
            src="../swiper/images/IMG_0933.jpeg"
            alt=""
          />
        </div>

      </div>
    </div>
      <!-- ドット -->
      <div class="swiper-pagination"></div>

      <!-- 矢印 -->
      <div class="swiper-button-prev swiper-button"></div>
      <div class="swiper-button-next swiper-button"></div>
    </div>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
